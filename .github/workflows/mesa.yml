name: mesa

# Cross-builds Mesa for iOS arm64 on a macOS runner: the OpenGL ES library
# behind the CoreAnimation bridge (tools/gpu/README.md).
#
# First step is softpipe with OSMesa. That proves the toolchain and gives a
# renderer that needs no GPU, so the EAGL bridge can be tested for
# correctness. panfrost follows once the S8Mali user client answers from
# user space.
#
# Mesa 25.0.7 is the last release with OSMesa (25.1 removed it).

on:
  workflow_dispatch:
    inputs:
      drivers:
        description: gallium drivers
        default: softpipe

env:
  MESA_VERSION: 25.0.7

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          brew install meson ninja bison flex pkg-config || true
          python3 -m pip install --user --break-system-packages --upgrade mako pyyaml packaging
          echo "PYTHONPATH=$(python3 -m site --user-site)" >> "$GITHUB_ENV"
          python3 -c 'import mako; print("mako", mako.__version__)'
          meson --version
          ninja --version

      - name: Fetch Mesa
        run: |
          for url in \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz" \
            "https://dl.freedesktop.org/mesa/archive/mesa-${MESA_VERSION}.tar.xz" \
            "https://github.com/mesa3d/mesa/archive/refs/tags/mesa-${MESA_VERSION}.tar.gz"; do
            echo "trying $url"
            if curl -fsSL --retry 3 -o mesa.tar.xz "$url"; then
              break
            fi
          done
          case $(file -b mesa.tar.xz) in
            *gzip*) tar xzf mesa.tar.xz ;;
            *) tar xf mesa.tar.xz ;;
          esac
          ln -sf "mesa-${MESA_VERSION}" mesa
          ls mesa | head

      - name: Patch Mesa for Darwin
        run: |
          cd mesa
          for p in ../tools/gpu/mesa/*.patch; do
            echo "applying $p"
            patch -p1 --forward < "$p"
          done

      - name: libdrm stand-in
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p shim
          for f in s8_drm s8_drm_libdrm; do
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -O2 -Wall \
              -isysroot "$SDK" -Itools/gpu/s8-drm \
              -c "tools/gpu/s8-drm/$f.c" -o "shim/$f.o"
          done
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -dynamiclib \
            -install_name /usr/lib/libs8drm.dylib -isysroot "$SDK" \
            -framework IOKit -framework CoreFoundation \
            -o shim/libs8drm.dylib shim/s8_drm.o shim/s8_drm_libdrm.o
          codesign -s - -f shim/libs8drm.dylib || true
          # Some Mesa targets include <xf86drm.h> without taking dep_libdrm,
          # so put our header where inc_include already points.
          cp tools/gpu/s8-drm/xf86drm.h tools/gpu/s8-drm/s8_drm.h mesa/include/
          cat > shim/libdrm.pc <<EOF
          prefix=$PWD/shim
          exec_prefix=\${prefix}
          libdir=\${prefix}
          includedir=$PWD/tools/gpu/s8-drm
          Name: libdrm
          Description: S8Mali user client, libdrm names
          Version: 2.4.120
          Libs: -L\${libdir} -ls8drm
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=$PWD/shim" >> "$GITHUB_ENV"
          cat shim/libdrm.pc

      - name: Cross file
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          cat > ios.ini <<EOF
          [binaries]
          c = ['xcrun', '--sdk', 'iphoneos', 'clang']
          cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
          objc = ['xcrun', '--sdk', 'iphoneos', 'clang']
          objcpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
          ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
          strip = ['xcrun', '--sdk', 'iphoneos', 'strip']
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          [built-in options]
          c_args = ['-target', 'arm64-apple-ios16.0', '-isysroot', '$SDK', '-Wno-error', '-I$PWD/tools/gpu/s8-drm']
          cpp_args = ['-target', 'arm64-apple-ios16.0', '-isysroot', '$SDK', '-Wno-error']
          objc_args = ['-target', 'arm64-apple-ios16.0', '-isysroot', '$SDK', '-Wno-error']
          objcpp_args = ['-target', 'arm64-apple-ios16.0', '-isysroot', '$SDK', '-Wno-error']
          c_link_args = ['-target', 'arm64-apple-ios16.0', '-isysroot', '$SDK', '-L$PWD/shim', '-ls8drm']
          cpp_link_args = ['-target', 'arm64-apple-ios16.0', '-isysroot', '$SDK', '-L$PWD/shim', '-ls8drm']
          EOF
          cat ios.ini

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cd mesa
          meson setup build --cross-file ../ios.ini \
            -Dosmesa=true \
            -Dgallium-drivers=softpipe${{ inputs.drivers && format(',{0}', inputs.drivers) || '' }} \
            -Dplatforms= \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgles1=disabled -Dgles2=disabled \
            -Dllvm=disabled \
            -Dgbm=disabled \
            -Dtools= \
            -Dbuild-tests=false \
            -Dvalgrind=disabled \
            -Dzstd=disabled \
            -Dshader-cache=disabled \
            --default-library=shared 2>&1 | tail -40

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cd mesa
          ninja -C build 2>&1 | tail -40

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          find mesa/build -name 'libOSMesa*.dylib' -o -name 'libgallium*.dylib' \
            -o -name 'libglapi*.dylib' | while read -r f; do cp "$f" out/; done
          cp shim/libs8drm.dylib out/
          ls -la out
          for f in out/*.dylib; do [ -e "$f" ] || continue; file "$f"; done

      - name: Build the OSMesa triangle test
        shell: bash
        run: |
          set -o pipefail
          if [ -f out/libOSMesa.8.dylib ]; then
            install_name_tool -id /usr/lib/libOSMesa.8.dylib out/libOSMesa.8.dylib
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -O2 -Wall \
              -isysroot "$SDK" -Imesa/include \
              -o out/s8_gltest tools/gpu/s8-drm/s8_gltest.c \
              -L out -lOSMesa -Wl,-rpath,/usr/lib \
              -framework IOKit -framework CoreFoundation
            codesign -s - -f out/s8_gltest || true
            otool -L out/s8_gltest
            file out/s8_gltest
          else
            echo "no libOSMesa, skipping the test build"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-ios
          path: out/
          if-no-files-found: warn
